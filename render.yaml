services:
  - type: web
    name: recipe-tool
    runtime: docker
    plan: free
    envVars:
      - key: MODE
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NOTE_STYLE
        value: classic
      - key: RENDER_EXTERNAL_URL
        value: https://recipe-tool-redo.onrender.com
